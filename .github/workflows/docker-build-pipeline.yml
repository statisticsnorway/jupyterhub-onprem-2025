# This workflow will build and push Docker images to the default Artifact Registry in SSB.
#
# Overview:
# 1. Authenticate to Google Cloud
# 2. Authenticate to Artifact Registry
# 3. Build and publish Hub, JupyterLab (R 4.4 / 4.6) and RStudio (R 4.4 / 4.6) images
#
# To configure this workflow:
# 1. Change the values for TEAM_NAME if needed.
# 2. Images are tagged with git ref, latest (main), and semver (releases).
#
# This workflow is tailored for SSB´s setup, however if you wish to use this in a non SSB context ensure/change the following:
# 1. Create GitHub secrets for GAR_PROJECT_NUMBER and GAR_PROJECT_ID (Number and ID for the Artifact Registry project).
# 2. Create and configure Workload Identity Federation for GitHub.

name: Docker Image CI
permissions:
  contents: read

on:
  release:
    types: [published]
  push:
    branches:
      - "main"
    paths:
      - 'docker/jupyterhub/Dockerfile.hub'
      - 'docker/jupyterhub/Dockerfile.lab'
      - 'docker/rstudio/Dockerfile'
      - '.github/workflows/docker-build-pipeline.yml'
  pull_request:
    paths:
      - 'docker/jupyterhub/Dockerfile.hub'
      - 'docker/jupyterhub/Dockerfile.lab'
      - 'docker/rstudio/Dockerfile'
      - '.github/workflows/docker-build-pipeline.yml'

env:
  REGISTRY_HOST: europe-north1-docker.pkg.dev
  REGISTRY: europe-north1-docker.pkg.dev/${{ secrets.GAR_PROJECT_ID }}
  TEAM_NAME: itinfra-bakkesyst
  TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:

  build:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: onprem-jupyterhub
            file: docker/jupyterhub/Dockerfile.hub
            context: docker/jupyterhub
            r_version: ""
            python_version: ""
            arrow_version: ""
          - image_name: onprem-jupyterlab-r440
            file: docker/jupyterhub/Dockerfile.lab
            context: docker/jupyterhub
            r_version: "4.4.0"
            python_version: "313"
            arrow_version: "24.0.0"
          - image_name: onprem-jupyterlab-r460
            file: docker/jupyterhub/Dockerfile.lab
            context: docker/jupyterhub
            r_version: "4.6.0"
            python_version: "313"
            arrow_version: "24.0.0"
          # context=docker/rstudio so COPY scripts/, start-singleuser.sh,
          # jupyter_server_config.py, rserver.conf, etc. resolve in that folder.
          - image_name: onprem-rstudio-r440
            file: docker/rstudio/Dockerfile
            context: docker/rstudio
            r_version: "4.4.0"
            python_version: ""
            arrow_version: "24.0.0"
          - image_name: onprem-rstudio-r460
            file: docker/rstudio/Dockerfile
            context: docker/rstudio
            r_version: "4.6.0"
            python_version: ""
            arrow_version: "24.0.0"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2.1.2
      with:
        workload_identity_provider: "projects/${{ secrets.GAR_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/gh-actions/providers/gh-actions"
        service_account: "gh-actions-${{ env.TEAM_NAME}}@${{ secrets.GAR_PROJECT_ID }}.iam.gserviceaccount.com"
        token_format: access_token
        create_credentials_file: true

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure docker auth helper
      run: gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3
      with:
        version: v0.29.1

    - name: Extract build metadata for Docker
      id: build_metadata
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.TEAM_NAME }}-docker/${{ matrix.image_name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern=v{{version}}
          type=semver,pattern=v{{major}}.{{minor}}
          type=semver,pattern=v{{major}}
          type=semver,pattern={{version}}
          type=raw,value=${{ env.TAG }}, enable=true

    - name: Build and push docker image to Artifact Registry
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.context }}
        provenance: false
        file: ${{ matrix.file }}
        push: true
        tags: ${{ steps.build_metadata.outputs.tags }}
        labels: ${{ steps.build_metadata.outputs.labels }}
        build-args: |
          R_VERSION=${{ matrix.r_version }}
          PYTHON_VERSION=${{ matrix.python_version }}
          ARROW_VERSION=${{ matrix.arrow_version }}
        cache-from: type=gha,scope=${{ matrix.image_name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  deploy_staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: pl-ghashr-p1

    steps:
      - name: Deploy via AWX
        env:
          AWX_TOKEN: ${{ secrets.AWX_TOKEN }}
        run: |
          set -euo pipefail
          REPO_NAME="jupyterhub-onprem-2025"
          TARGETS='["sl-jupyter-t1.ssb.no"]'  # JSON array

          curl -k -X POST "https://gjallarbru.ssb.no/api/v2/job_templates/307/launch/" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${AWX_TOKEN}" \
            --data-raw "{\"extra_vars\":{\"repo_name\":\"${REPO_NAME}\",\"target_hosts\":${TARGETS}}}"

  deploy_prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: pl-ghashr-p1   #  This is where the GitHub runner is hosted ; *not* the staging host itself

    steps:
      - name: Deploy via AWX
        env:
          AWX_TOKEN: ${{ secrets.AWX_TOKEN }}
        run: |
          set -euo pipefail
          REPO_NAME="jupyterhub-onprem-2025"
          TARGETS='["sl-jupyter-p1.ssb.no"]'  # JSON array

          curl -k -X POST "https://gjallarbru.ssb.no/api/v2/job_templates/307/launch/" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${AWX_TOKEN}" \
            --data-raw "{\"extra_vars\":{\"repo_name\":\"${REPO_NAME}\",\"target_hosts\":${TARGETS}}}"
