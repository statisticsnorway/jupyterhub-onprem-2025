{% extends "page.html" %}

{% block main %}
<div class="environment-page">
    <div class="environment-container">

        <div class="environment-header">
            <h1>Choose your environment</h1>
            <p>Select the workspace you want to start.</p>
        </div>

        <form
            enctype="multipart/form-data"
            id="spawn_form"
            action="{{ url }}"
            method="post"
            role="form"
        >
            {{ spawner_options_form | safe }}

            <div class="spawn-actions">
                <button
                    type="submit"
                    class="btn-start"
                    id="spawn"
                >
                    Start environment
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}


{% block stylesheet %}
{{ super() }}

<style>

.environment-page {
    min-height: calc(100vh - 70px);
    background:
        radial-gradient(circle at top left, rgba(66, 153, 225, 0.10), transparent 35%),
        #f6f8fb;

    padding: 70px 20px;
}

.environment-container {
    max-width: 1000px;
    margin: 0 auto;
}

/* ------------------------------------------------------------------
   Header
------------------------------------------------------------------ */

.environment-header {
    text-align: center;
    margin-bottom: 45px;
}

.environment-header h1 {
    font-size: 36px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 10px;
}

.environment-header p {
    font-size: 17px;
    color: #6b7280;
}


/* ------------------------------------------------------------------
   Profile container generated by the Spawner
------------------------------------------------------------------ */

#spawn_form .form-group {
    margin-bottom: 0;
}

/*
    This targets the radio-button options generated by the spawner.

    JS below also adds .environment-option to their parent elements,
    making the styling less dependent on the exact bootstrap markup.
*/

.environment-options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
    margin-bottom: 35px;
}


/* ------------------------------------------------------------------
   Card
------------------------------------------------------------------ */

.environment-card {
    position: relative;

    min-height: 220px;

    display: flex;
    flex-direction: column;

    padding: 30px;

    border: 2px solid #e5e7eb;
    border-radius: 18px;

    background: #ffffff;

    cursor: pointer;

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background-color 0.18s ease;

    user-select: none;
}

.environment-card:hover {
    transform: translateY(-4px);

    border-color: #9ca3af;

    box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.08);
}


/* ------------------------------------------------------------------
   Selected
------------------------------------------------------------------ */

.environment-card.selected {
    border-color: #2563eb;

    background:
        linear-gradient(
            145deg,
            rgba(37, 99, 235, 0.055),
            rgba(255,255,255,1)
        );

    box-shadow:
        0 12px 32px rgba(37, 99, 235, 0.13);
}


/* ------------------------------------------------------------------
   Hidden actual radio
------------------------------------------------------------------ */

.environment-card input[type="radio"] {
    position: absolute;

    opacity: 0;

    pointer-events: none;
}


/* ------------------------------------------------------------------
   Icon
------------------------------------------------------------------ */

.environment-icon {
    width: 62px;
    height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 24px;

    border-radius: 14px;

    font-size: 31px;

    background: #f3f4f6;
}

.environment-card.selected .environment-icon {
    background: #eff6ff;
}


/* ------------------------------------------------------------------
   Text
------------------------------------------------------------------ */

.environment-name {
    font-size: 22px;
    font-weight: 700;

    color: #111827;

    margin-bottom: 9px;
}

.environment-description {
    font-size: 15px;

    color: #6b7280;

    line-height: 1.55;

    flex-grow: 1;
}


/* ------------------------------------------------------------------
   Badge / checkmark
------------------------------------------------------------------ */

.environment-check {
    position: absolute;

    top: 20px;
    right: 20px;

    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #d1d5db;
    border-radius: 50%;

    color: transparent;

    font-size: 16px;
    font-weight: bold;

    transition: all 0.15s ease;
}

.environment-card.selected .environment-check {
    background: #2563eb;
    border-color: #2563eb;

    color: white;
}


/* ------------------------------------------------------------------
   Start button
------------------------------------------------------------------ */

.spawn-actions {
    display: flex;
    justify-content: center;

    margin-top: 35px;
}

.btn-start {
    min-width: 220px;

    padding: 13px 28px;

    border: none;
    border-radius: 10px;

    background: #2563eb;

    color: white;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 5px 14px rgba(37, 99, 235, 0.25);

    transition:
        background-color 0.15s ease,
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.btn-start:hover {
    background: #1d4ed8;

    transform: translateY(-1px);

    box-shadow:
        0 7px 18px rgba(37, 99, 235, 0.32);
}


/* ------------------------------------------------------------------
   Mobile
------------------------------------------------------------------ */

@media (max-width: 700px) {

    .environment-page {
        padding: 40px 15px;
    }

    .environment-header h1 {
        font-size: 29px;
    }

    .environment-options {
        grid-template-columns: 1fr;
    }
}

</style>

{% endblock %}


{% block script %}
{{ super() }}

<script>
document.addEventListener("DOMContentLoaded", function () {

    /*
     * Find the profile radio buttons produced by the Spawner.
     *
     * We don't replace the inputs themselves because JupyterHub still
     * needs their original name/value when the form is submitted.
     */
    const radios = Array.from(
        document.querySelectorAll(
            '#spawn_form input[type="radio"]'
        )
    );

    if (!radios.length) {
        return;
    }


    /*
     * Create our own grid around the existing options.
     */
    const optionsContainer = document.createElement("div");
    optionsContainer.className = "environment-options";


    radios.forEach(function (radio, index) {

        /*
         * Try to find the original label.
         */
        let label = document.querySelector(
            'label[for="' + radio.id + '"]'
        );

        let originalContainer =
            radio.closest(".radio") ||
            radio.closest(".form-check") ||
            radio.parentElement;


        /*
         * Extract text from whatever markup the Spawner generated.
         */
        let text = "";

        if (label) {
            text = label.innerText.trim();
        } else if (originalContainer) {
            text = originalContainer.innerText.trim();
        }


        /*
         * Determine which profile this is.
         *
         * We use the visible text first, then fall back to the index.
         */
        const lowerText = text.toLowerCase();

        let name;
        let description;
        let icon;

        if (lowerText.includes("rstudio")) {

            name = "RStudio Server";

            description =
                "R development environment with the familiar RStudio IDE.";

            icon = "R";

        } else {

            name = "JupyterLab";

            description =
                "Python, R and interactive notebooks in JupyterLab.";

            icon = "📓";
        }


        /*
         * Card
         */
        const card = document.createElement("label");

        card.className = "environment-card";


        /*
         * Keep the REAL Spawner radio button.
         */
        card.appendChild(radio);


        /*
         * Visual content
         */
        const check = document.createElement("div");
        check.className = "environment-check";
        check.innerHTML = "✓";


        const iconElement = document.createElement("div");
        iconElement.className = "environment-icon";
        iconElement.textContent = icon;


        const nameElement = document.createElement("div");
        nameElement.className = "environment-name";
        nameElement.textContent = name;


        const descriptionElement = document.createElement("div");
        descriptionElement.className = "environment-description";
        descriptionElement.textContent = description;


        card.appendChild(check);
        card.appendChild(iconElement);
        card.appendChild(nameElement);
        card.appendChild(descriptionElement);


        /*
         * Clicking anywhere on the card selects the original radio.
         */
        card.addEventListener("click", function () {

            radio.checked = true;

            updateSelectedCard();
        });


        optionsContainer.appendChild(card);


        /*
         * Remove the old bootstrap wrapper after moving its radio.
         */
        if (
            originalContainer &&
            originalContainer !== card &&
            originalContainer.parentNode
        ) {
            originalContainer.remove();
        }
    });


    /*
     * Put the cards before the Start button.
     */
    const actions = document.querySelector(".spawn-actions");

    actions.parentNode.insertBefore(
        optionsContainer,
        actions
    );


    function updateSelectedCard() {

        document
            .querySelectorAll(".environment-card")
            .forEach(function (card) {

                const input =
                    card.querySelector('input[type="radio"]');

                card.classList.toggle(
                    "selected",
                    input && input.checked
                );
            });
    }


    /*
     * Respect whichever profile JupyterHub/Spawner marked as default.
     */
    updateSelectedCard();

});
</script>

{% endblock %}
