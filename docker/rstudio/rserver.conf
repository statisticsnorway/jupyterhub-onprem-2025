# JupyterHub already authenticates; jupyter-rsession-proxy launches rserver.
# session-timeout-minutes belongs in rsession.conf, not here — rserver --help
# exits 1 on unknown keys and jupyter-rsession-proxy then returns HTTP 500.
rsession-which-r=/usr/local/bin/R
www-frame-origin=same
auth-none=1
server-app-armor-enabled=0
